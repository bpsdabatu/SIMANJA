# Konfigurasi Supabase CLI (pengembangan lokal). Produksi dikonfigurasi di dashboard Supabase;
# lihat docs/deployment.md untuk nilai yang harus disamakan.
project_id = "simaspraja"

[api]
enabled = true
port = 54321
schemas = ["public"]            # skema "app" (fungsi bantu RLS) sengaja TIDAK diekspos
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false            # akun hanya dibuat administrator (scripts/create-user.ts / modul Pengguna)
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
enable_confirmations = false     # email internal sintetis; tidak ada pengiriman email ke pengguna
double_confirm_changes = false

[auth.rate_limit]
sign_in_sign_ups = 30            # per 5 menit per IP (lapisan tambahan di luar throttling aplikasi)

[auth.mfa.totp]
enroll_enabled = false           # MFA opsional: belum dipakai pada Phase 1 (lihat Known Limitations)
verify_enabled = false

# Bucket privat (digunakan mulai Phase 2/4). Tidak ada akses publik.
[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.transaction-attachments]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg"]

[storage.buckets.imports]
public = false
file_size_limit = "20MiB"
allowed_mime_types = [
  "application/pdf",
  "text/csv",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
]
